{% extends "base.html" %}

{% block title %}{{ playlist.name }} — Vibe Vault{% endblock %}

{% block content %}
<div class="playlist-detail-page">
  
  <!-- Hero Banner -->
  <div class="vibe-card p-4 mb-4" style="background: linear-gradient(135deg, #ffffff 0%, #eaf4ff 50%, #dceeff 100%); border-color: var(--blue-300);">
    <div class="d-flex flex-column flex-md-row align-items-center gap-4">
      <img src="{{ url_for('serve_cover', filename=playlist.cover_image or 'default_playlist.png') }}" alt="{{ playlist.name }}" style="width: 180px; height: 180px; border-radius: 16px; object-fit: cover; box-shadow: var(--shadow-md); border: 2px solid var(--blue-200);">
      
      <div class="flex-grow-1 text-center text-md-start">
        <div class="badge rounded-pill px-3 py-1 mb-2" style="background: var(--blue-100); color: var(--blue-700); font-weight: 700; font-size: 11px; letter-spacing: 1px; border: 1px solid var(--blue-300);">
          PLAYLIST
        </div>
        <h1 class="brand-font display-5 mb-2 fw-bold text-heading">{{ playlist.name }}</h1>
        <p class="text-muted mb-3" style="max-width: 600px; font-size: 14.5px;">{{ playlist.description or 'No description provided.' }}</p>
        
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-start gap-3 text-muted small mb-4 fw-semibold">
          <span><i class="fas fa-user me-1 text-primary"></i> {{ current_user.full_name or current_user.username }}</span>
          <span>•</span>
          <span id="playlist-song-count-badge">0 songs</span>
          <span>•</span>
          <span id="playlist-duration-badge">0:00</span>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-start gap-2">
          <button class="btn btn-vibe-primary" onclick="playEntirePlaylist({{ playlist.id }})">
            <i class="fas fa-play me-1"></i> Play All
          </button>
          <button class="btn btn-vibe-secondary" onclick="shuffleEntirePlaylist({{ playlist.id }})">
            <i class="fas fa-random me-1"></i> Shuffle
          </button>
          <button class="btn btn-icon" onclick='openEditPlaylistModal({{ playlist|tojson }})' title="Edit Playlist">
            <i class="fas fa-pen"></i>
          </button>
          <button class="btn btn-icon" onclick="confirmDeletePlaylist({{ playlist.id }}, '{{ playlist.name }}')" title="Delete Playlist">
            <i class="fas fa-trash-alt"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Song List Container -->
  <div id="playlist-songs-container">
    <!-- Populated via static/js/playlists.js loadSinglePlaylist() -->
  </div>

</div>

<script>
  if (typeof window.loadSinglePlaylist === 'function') {
    window.loadSinglePlaylist({{ playlist.id }});
  }
</script>
{% endblock %}
