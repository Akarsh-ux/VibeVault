{% extends "base.html" %}

{% block title %}Playlists — Vibe Vault{% endblock %}

{% block content %}
<div class="playlists-page">
  
  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
      <h2 class="brand-font mb-1"><i class="fas fa-list text-primary me-2"></i> My Playlists</h2>
      <p class="text-muted mb-0" style="font-size: 14.5px;">Curated collections and soundtracks for every mood.</p>
    </div>
    <button class="btn btn-vibe-primary" onclick="openCreatePlaylistModal()">
      <i class="fas fa-plus me-1"></i> Create Playlist
    </button>
  </div>

  <!-- Playlists Grid Container -->
  <div id="playlists-grid-container">
    <!-- Populated via static/js/playlists.js loadAllPlaylists() -->
  </div>

</div>

<script>
  if (typeof window.loadAllPlaylists === 'function') {
    window.loadAllPlaylists();
  }
</script>
{% endblock %}
