{% extends "base.html" %}

{% block title %}Recently Played — Vibe Vault{% endblock %}

{% block content %}
<div class="recently-played-page">

  <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
    <div>
      <h2 class="brand-font mb-1"><i class="fas fa-history text-primary me-2"></i> Recently Played</h2>
      <p class="text-muted mb-0" style="font-size: 14.5px;">Your personal listening timeline and playback history.</p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-vibe-primary" onclick="playAllRecent()">
        <i class="fas fa-play me-1"></i> Play History
      </button>
      <button class="btn btn-vibe-secondary btn-sm px-3" onclick="clearPlaybackHistory()">
        <i class="fas fa-trash-alt me-1"></i> Clear History
      </button>
    </div>
  </div>

  <div id="recently-played-container">
    <div class="text-center py-5 text-muted">
      <i class="fas fa-spinner fa-spin fa-2x mb-3 text-primary"></i>
      <p>Loading your listening history...</p>
    </div>
  </div>

</div>

<script>
  let recentSongsList = [];

  function loadRecentlyPlayed() {
    const container = document.getElementById('recently-played-container');
    fetch('/api/recently-played')
      .then(res => res.json())
      .then(data => {
        if (!data.success || !container) return;
        recentSongsList = data.songs;

        if (data.songs.length === 0) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon"><i class="fas fa-history"></i></div>
              <h3 class="empty-state-title">No listening history yet</h3>
              <p class="empty-state-text">Start listening to your music tracks to automatically build your listening history and play stats.</p>
              <a href="/music" class="btn btn-vibe-secondary"><i class="fas fa-play me-2"></i> Listen to Music</a>
            </div>
          `;
          return;
        }

        let html = `
          <div class="song-table-container">
            <table class="song-table">
              <thead>
                <tr>
                  <th style="width: 50px;">#</th>
                  <th>Title & Artist</th>
                  <th>Album</th>
                  <th>Played When</th>
                  <th style="width: 80px;"><i class="far fa-clock"></i></th>
                  <th style="width: 100px; text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody>
        `;

        data.songs.forEach((song, idx) => {
          const isCurrent = window.VibePlayer && window.VibePlayer.getCurrentSong()?.id === song.id;
          const songJson = JSON.stringify(song).replace(/"/g, '&quot;');
          const queueJson = JSON.stringify(data.songs).replace(/"/g, '&quot;');

          html += `
            <tr class="song-row ${isCurrent ? 'active-track' : ''}" data-song-id="${song.id}" data-index="${idx + 1}">
              <td class="song-index-col" onclick='window.VibePlayer.playTrack(${songJson}, ${queueJson}, ${idx})' style="cursor: pointer;">
                ${isCurrent && window.VibePlayer.isPlaying ? `
                  <div class="equalizer"><div class="equalizer-bar"></div><div class="equalizer-bar"></div><div class="equalizer-bar"></div></div>
                ` : (idx + 1)}
              </td>
              <td>
                <div class="d-flex align-items-center">
                  <img src="/uploads/covers/${song.cover_image || 'default_cover.png'}" class="song-thumb" style="cursor: pointer;" onclick='window.VibePlayer.playTrack(${songJson}, ${queueJson}, ${idx})'>
                  <div style="min-width: 0;">
                    <div class="song-title-cell fw-bold text-truncate text-heading" style="cursor: pointer;" onclick='window.VibePlayer.playTrack(${songJson}, ${queueJson}, ${idx})'>
                      ${song.title}
                    </div>
                    <div class="text-muted text-truncate" style="font-size: 12.5px;">${song.artist || 'Unknown Artist'}</div>
                  </div>
                </div>
              </td>
              <td class="text-muted text-truncate" style="max-width: 140px;">${song.album || 'Single'}</td>
              <td class="text-muted" style="font-size: 13px;">${formatPlayedTime(song.played_at)}</td>
              <td class="text-muted" style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px;">${formatDuration(song.duration)}</td>
              <td style="text-align: right;">
                <button class="btn-favorite btn-fav-song-${song.id} ${song.is_favorite ? 'active' : ''}" onclick="window.toggleFavorite(${song.id}, this)" title="Favorite">
                  <i class="${song.is_favorite ? 'fas fa-heart' : 'far fa-heart'}"></i>
                </button>
                <button class="btn btn-sm btn-icon" onclick="window.openAddToPlaylistModal(${song.id}, '${song.title.replace(/'/g, "\\'")}')" title="Add to Playlist">
                  <i class="fas fa-list-ul"></i>
                </button>
              </td>
            </tr>
          `;
        });

        html += '</tbody></table></div>';
        container.innerHTML = html;
      });
  }

  function formatPlayedTime(dateStr) {
    if (!dateStr) return 'Recently';
    try {
      const d = new Date(dateStr.replace(' ', 'T'));
      if (isNaN(d)) return dateStr;
      const now = new Date();
      const diffSecs = Math.floor((now - d) / 1000);

      if (diffSecs < 60) return 'Just now';
      if (diffSecs < 3600) return `${Math.floor(diffSecs / 60)}m ago`;
      if (diffSecs < 86400) return `${Math.floor(diffSecs / 3600)}h ago`;
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      return dateStr;
    }
  }

  function playAllRecent() {
    if (recentSongsList.length > 0 && window.VibePlayer) {
      window.VibePlayer.playTrack(recentSongsList[0], recentSongsList, 0);
    } else {
      window.showToast('No history to play.', 'warning');
    }
  }

  function clearPlaybackHistory() {
    if (confirm('Are you sure you want to clear your listening history? (Song files and play counts will not be deleted)')) {
      fetch('/api/recently-played/clear', {
        method: 'POST',
        headers: { 'X-CSRF-Token': window.getCsrfToken() }
      })
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            window.showToast(data.message, 'success');
            loadRecentlyPlayed();
          }
        });
    }
  }

  if (typeof loadRecentlyPlayed === 'function') {
    loadRecentlyPlayed();
  }
</script>
{% endblock %}
