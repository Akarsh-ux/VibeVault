<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="vaultBlueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon / Waveform Vault Symbol -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="#f0f8ff" stroke="url(#vaultBlueGlow)" stroke-width="2" />
    <!-- Animated Style Soundwave Bars in Vibrant Blues -->
    <rect x="14" y="24" width="4" height="16" rx="2" fill="#2563eb" />
    <rect x="22" y="16" width="4" height="32" rx="2" fill="#0284c7" />
    <rect x="30" y="10" width="4" height="42" rx="2" fill="#38bdf8" filter="url(#glow)" />
    <rect x="38" y="20" width="4" height="24" rx="2" fill="#0284c7" />
    <rect x="46" y="28" width="4" height="10" rx="2" fill="#2563eb" />
  </g>
  
  <!-- Logo Text -->
  <text x="82" y="42" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="900" fill="#0f172a" letter-spacing="0.5">
    VIBE<tspan fill="url(#vaultBlueGlow)">VAULT</tspan>
  </text>
  <text x="84" y="58" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="2.5">
    PERSONAL MUSIC STUDIO
  </text>
</svg>
