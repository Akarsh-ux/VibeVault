version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: vibevault_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: vibe_vault
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword123"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: vibevault_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - SECRET_KEY=vibevault_super_secret_production_key_1234567890abcdef
      - DATABASE_URL=mysql://root:password123@db:3306/vibe_vault
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=password123
      - DB_NAME=vibe_vault
      - PORT=5000
      - FLASK_DEBUG=0
      - SESSION_COOKIE_SECURE=false
      - STORAGE_BACKEND=local
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
